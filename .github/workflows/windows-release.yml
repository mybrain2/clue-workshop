name: windows-release

on:
  workflow_dispatch: {}
  push:
    branches: [main, release]

jobs:
  windows-build:
    permissions:
      contents: write
      issues: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend + prepare XMind sidecar（生成 node.exe，cargo test 依赖它）
        working-directory: app
        run: npm run build

      - name: Rust tests
        working-directory: app/src-tauri
        env:
          RUST_BACKTRACE: full
        run: cargo test --release 2>&1 | tee test-output.log | tail -40
        shell: bash

      - name: Report failure to issue (publicly readable)
        if: failure()
        working-directory: app/src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --color d73a4a 2>/dev/null || true
          FAILED_TESTS=$(grep -E "^test .* (FAILED|panicked)|panicked at|test result: FAILED|stack backtrace|at case_core|at structured" test-output.log | head -60 || true)
          TAIL=$(tail -150 test-output.log)
          {
            echo "## 失败摘要"
            echo '```'
            echo "$FAILED_TESTS"
            echo '```'
            echo "## 日志尾部"
            echo '```'
            echo "$TAIL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          EXISTING=$(gh issue list --label ci-failure --state open --json number --jq 'length' 2>/dev/null || echo 1)
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "CI Windows 测试失败（$(date +%Y%m%d-%H%M)）" --label ci-failure --body "$(printf '## 失败摘要\n\`\`\`\n%s\n\`\`\`\n\n## 日志尾部\n\`\`\`\n%s\n\`\`\`\n' "$FAILED_TESTS" "$TAIL")"
          else
            gh issue comment $(gh issue list --label ci-failure --state open --json number --jq '.[0].number') --body "$(printf '## 再次失败（%s）\n\`\`\`\n%s\n\`\`\`\n' "$(date +%Y%m%d-%H%M)" "$FAILED_TESTS")"
          fi
          echo "issue 上报完成"

      - name: Build Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: "线索研判 v__VERSION__ (Windows)"
          releaseBody: "由 GitHub Actions 自动构建。安装包为 NSIS x64，静默安装参数 /S。"
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
