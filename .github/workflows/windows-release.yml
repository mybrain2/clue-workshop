name: windows-release

on:
  workflow_dispatch: {}
  push:
    branches: [main, release]

jobs:
  windows-build:
    permissions:
      contents: write
      issues: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust (pinned by rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend + prepare XMind sidecar（生成 node.exe，cargo test 依赖它）
        working-directory: app
        run: npm run build

      - name: Rust tests
        working-directory: app/src-tauri
        env:
          RUST_BACKTRACE: full
        run: cargo test --release 2>&1 | tee test-output.log | tail -40
        shell: bash

      - name: Clean stale draft releases (avoid asset already_exists)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/{owner}/{repo}/releases" --jq '.[] | select(.draft == true) | .id' | while read -r RID; do
            echo "删除旧草稿 id=$RID"
            gh api -X DELETE "repos/{owner}/{repo}/releases/$RID" || echo "删除失败 id=$RID"
          done
      - name: Build Tauri (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          includeDebug: true
          tagName: v__VERSION__
          releaseName: "线索研判 v__VERSION__ (Windows)"
          releaseBody: "由 GitHub Actions 自动构建。安装包为 NSIS x64，静默安装参数 /S。"
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
      - name: Collect NSIS diagnostics (on failure)
        if: failure()
        shell: powershell
        run: |
          "=== NSIS 产物目录 ===" | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Encoding utf8
          if (Test-Path "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis") {
            Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle\nsis" | Format-Table Name,Length | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8
          } else { "目录不存在" | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8 }
          "=== Rust target bundle 目录 ===" | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8
          if (Test-Path "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle") {
            Get-ChildItem "app\src-tauri\target\x86_64-pc-windows-msvc\release\bundle" | Select-Object -ExpandProperty Name | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8
          }
          "=== Tauri 缓存目录 ===" | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8
          if (Test-Path "$env:LOCALAPPDATA\tauri") { Get-ChildItem "$env:LOCALAPPDATA\tauri" | Select-Object -ExpandProperty Name | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8 } else { "$env:LOCALAPPDATA\tauri 不存在" | Out-File -FilePath "$env:GITHUB_WORKSPACE\nsis-diag.txt" -Append -Encoding utf8 }
          Get-Content nsis-diag.txt

      - name: Publish draft to official release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh api "repos/{owner}/{repo}/releases" --jq '.[] | select(.draft == true) | .id' | while read -r RID; do
            echo "发布草稿 id=$RID"
            gh api -X PATCH "repos/{owner}/{repo}/releases/$RID" -f draft=false || echo "PATCH失败 id=$RID"
          done
      - name: Report failure to issue (publicly readable)
        if: failure()
        working-directory: app/src-tauri
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create ci-failure --color d73a4a 2>/dev/null || true
          # 判定失败环节：tests 阶段 grep 命中即为测试失败，否则是构建失败
          FAILED_TESTS=$(grep -E "^test .* (FAILED|panicked)|panicked at|test result: FAILED" test-output.log 2>/dev/null | head -60 || true)
          if [ -n "$FAILED_TESTS" ]; then
            STAGE="Rust tests"
            TAIL=$(tail -150 test-output.log)
          else
            STAGE="Build Tauri (NSIS) / tauri-action"
            TAIL=$(cat "$GITHUB_WORKSPACE/nsis-diag.txt" 2>/dev/null || echo "诊断文件缺失；Rust tests 全过，失败在构建阶段")
          fi
          {
            echo "## 失败摘要"
            echo '```'
            echo "$FAILED_TESTS"
            echo '```'
            echo "## 日志尾部"
            echo '```'
            echo "$TAIL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          EXISTING=$(gh issue list --label ci-failure --state open --json number --jq 'length' 2>/dev/null || echo 1)
          if [ "$EXISTING" = "0" ]; then
            gh issue create --title "CI Windows 失败：${STAGE}（$(date +%Y%m%d-%H%M)）" --label ci-failure --body "$(printf '## 失败阶段：%s\n\`\`\`\n%s\n\`\`\`\n\n## 日志尾部\n\`\`\`\n%s\n\`\`\`\n' "$STAGE" "$FAILED_TESTS" "$TAIL")"
          else
            gh issue comment $(gh issue list --label ci-failure --state open --json number --jq '.[0].number') --body "$(printf '## 再次失败（%s · %s）\n\`\`\`\n%s\n\`\`\`\n' "$(date +%Y%m%d-%H%M)" "$STAGE" "$FAILED_TESTS")"
          fi
          echo "issue 上报完成"
