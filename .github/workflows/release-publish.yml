name: release-publish

# 用途：把 windows-release.yml 产出的 Draft Release 转为正式发布。
# 背景：Draft Release 的资产匿名不可下载；正式 Release 在 public 仓库匿名可下载。
# 触发：手动（workflow_dispatch）——发布是人工决策，不自动执行。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release-publish.yml']
    inputs:
      tag:
        description: "要发布的 tag（如 v0.7.15）"
        required: true
        type: string

jobs:
  publish:
    permissions:
      contents: write
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then TAG="v0.7.15"; fi
          {
            echo "## release-publish 诊断"
            echo "TAG=$TAG"
            echo "### 全部 releases（认证视角）："
            gh api "repos/{owner}/{repo}/releases?per_page=20" --jq '.[] | "id=\(.id) tag=\(.tag_name) draft=\(.draft) assets=\(.assets | length)"' || echo "列出失败"
          } > publish-diag.txt 2>&1
          cat publish-diag.txt
          echo "--- jq 查询草稿 ---"
          gh api "repos/{owner}/{repo}/releases?per_page=20" --jq ".[] | select(.draft == true) | \"draft: \(.id) \(.tag_name) assets=\(.assets | length)\"" || echo "jq失败"
          RELEASE_ID=$(gh api "repos/{owner}/{repo}/releases" --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id" | head -1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::tag=$TAG 的草稿不存在"
            exit 1
          fi
          gh api -X PATCH "repos/{owner}/{repo}/releases/$RELEASE_ID" -f draft=false
          echo "已发布"

      - name: Report to issue (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "release-publish 失败诊断："
            echo "当前 releases（认证视角）："
            gh api "repos/{owner}/{repo}/releases?per_page=30" --jq '.[] | "id=\(.id) tag=\(.tag_name) draft=\(.draft) assets=\(.assets|length)"' || echo "API列出失败"
            echo "---诊断文件内容---"
            cat publish-diag.txt 2>/dev/null || echo "（无诊断文件）"
          echo "---publish-diag.txt---"
          cat publish-diag.txt 2>/dev/null || echo "（无）"
          echo "---gh version---"
          gh --version
          } > /tmp/report.txt 2>&1
          gh issue comment 2 --body-file /tmp/report.txt || echo "issue评论失败"

